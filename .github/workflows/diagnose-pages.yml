name: Diagnose GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-pages.yml

permissions:
  contents: read
  actions: read
  pages: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages, Actions, and live site
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          request() {
            local name="$1"
            local url="$2"
            local output="/tmp/${name}.json"
            local status
            status=$(curl -sS -o "$output" -w '%{http_code}' "${headers[@]}" "$url" || true)
            printf '%s' "$status" > "/tmp/${name}.status"
          }

          request pages "${api}/pages"
          request latest_build "${api}/pages/builds/latest"
          request actions_permissions "${api}/actions/permissions"
          request workflow_permissions "${api}/actions/permissions/workflow"
          request workflow_runs "${api}/actions/runs?per_page=20"

          curl -sSIL --max-time 30 https://ag-prudenzano.github.io/ \
            > /tmp/live-headers.txt 2>&1 || true
          curl -sSL --max-time 30 https://ag-prudenzano.github.io/quantitative.html \
            > /tmp/live-quantitative.html 2>/tmp/live-curl-error.txt || true
          grep -E 'deployment-version|research-index.css|Quantitative Research' \
            /tmp/live-quantitative.html > /tmp/live-marker.txt || true

          {
            echo '# Automated GitHub Pages diagnostics'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            for name in pages latest_build actions_permissions workflow_permissions workflow_runs; do
              echo "## ${name} — HTTP $(cat "/tmp/${name}.status")"
              echo '```json'
              if jq . "/tmp/${name}.json" >/dev/null 2>&1; then
                jq . "/tmp/${name}.json"
              else
                cat "/tmp/${name}.json"
              fi
              echo '```'
              echo
            done
            echo '## Live homepage headers'
            echo '```text'
            cat /tmp/live-headers.txt
            echo '```'
            echo
            echo '## Live quantitative marker'
            echo '```html'
            cat /tmp/live-marker.txt
            cat /tmp/live-curl-error.txt
            echo '```'
          } > /tmp/pages-diagnostics.md

          gh issue create \
            --repo "$REPOSITORY" \
            --title "Automated GitHub Pages diagnostics ${COMMIT_SHA:0:7}" \
            --body-file /tmp/pages-diagnostics.md
